name: mygame_app
description: MYGame Marketplace - Buy & Sell Game Accounts Safely
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  local_auth: ^2.1.7
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  intl: ^0.19.0
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lang/
